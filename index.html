<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-display {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .joke-text {
            color: #333;
            font-size: 1.2em;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        select {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: border-color 0.3s;
            flex: 1;
            min-width: 150px;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            flex: 1;
            min-width: 150px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            text-align: center;
            color: #667eea;
            font-size: 1.1em;
            padding: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #c33;
            margin-bottom: 20px;
        }

        .stats {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .api-info {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 0.9em;
            color: #555;
        }

        .api-info strong {
            color: #667eea;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .controls {
                flex-direction: column;
            }

            select, button {
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator</h1>
        <p class="subtitle">Get a random laugh every time!</p>

        <div id="errorContainer"></div>

        <div class="controls">
            <select id="jokeCategorySelect">
                <option value="any">Any Category</option>
                <option value="general">General</option>
                <option value="programming">Programming</option>
                <option value="knock-knock">Knock-Knock</option>
            </select>
            <button onclick="generateJoke()" id="generateBtn">Get a Joke</button>
        </div>

        <div class="joke-display">
            <div class="joke-text" id="jokeText">
                Click "Get a Joke" to start laughing! 🎉
            </div>
        </div>

        <div class="stats">
            <p>Jokes loaded: <strong id="jokeCount">0</strong></p>
        </div>

        <div class="api-info">
            <strong>APIs Used:</strong>
            <ul style="margin-left: 20px; margin-top: 8px;">
                <li>JokeAPI - General jokes</li>
                <li>Official Joke API - Knock-knock jokes</li>
            </ul>
        </div>
    </div>

    <script>
        let jokeCount = 0;

        async function generateJoke() {
            const category = document.getElementById('jokeCategorySelect').value;
            const btn = document.getElementById('generateBtn');
            const jokeText = document.getElementById('jokeText');
            const errorContainer = document.getElementById('errorContainer');

            btn.disabled = true;
            errorContainer.innerHTML = '';
            jokeText.innerHTML = '<div class="spinner"></div><div class="loading">Loading joke...</div>';

            try {
                let joke = null;

                if (category === 'knock-knock') {
                    joke = await fetchKnockKnockJoke();
                } else if (category === 'programming') {
                    joke = await fetchProgrammingJoke();
                } else if (category === 'general') {
                    joke = await fetchGeneralJoke();
                } else {
                    // Random category
                    const categories = ['general', 'programming', 'knock-knock'];
                    const randomCat = categories[Math.floor(Math.random() * categories.length)];
                    
                    if (randomCat === 'knock-knock') {
                        joke = await fetchKnockKnockJoke();
                    } else if (randomCat === 'programming') {
                        joke = await fetchProgrammingJoke();
                    } else {
                        joke = await fetchGeneralJoke();
                    }
                }

                displayJoke(joke);
                jokeCount++;
                document.getElementById('jokeCount').textContent = jokeCount;

            } catch (error) {
                console.error('Error:', error);
                errorContainer.innerHTML = `<div class="error">😕 Failed to load joke. Please try again!</div>`;
                jokeText.innerHTML = 'Unable to fetch joke. Please check your connection and try again.';
            } finally {
                btn.disabled = false;
            }
        }

        async function fetchGeneralJoke() {
            const response = await fetch('https://v2.jokeapi.dev/joke/Any?type=single');
            if (!response.ok) throw new Error('Failed to fetch');
            const data = await response.json();
            
            if (data.error) throw new Error('Joke API error');
            
            return {
                text: data.joke,
                type: 'General',
                category: data.category
            };
        }

        async function fetchProgrammingJoke() {
            const response = await fetch('https://v2.jokeapi.dev/joke/Programming?type=single');
            if (!response.ok) throw new Error('Failed to fetch');
            const data = await response.json();
            
            if (data.error) throw new Error('Joke API error');
            
            return {
                text: data.joke,
                type: 'Programming',
                category: data.category
            };
        }

        async function fetchKnockKnockJoke() {
            const response = await fetch('https://official-joke-api.appspot.com/jokes/knock-knock/random');
            if (!response.ok) throw new Error('Failed to fetch');
            const data = await response.json();
            
            const jokeText = `${data.setup}\n${data.delivery}`;
            return {
                text: jokeText,
                type: 'Knock-Knock',
                category: 'knock-knock'
            };
        }

        function displayJoke(joke) {
            const jokeText = document.getElementById('jokeText');
            const text = joke.text.replace(/\n/g, '<br>');
            jokeText.innerHTML = `
                <div>
                    <div>${text}</div>
                    <div class="joke-type">${joke.type}</div>
                </div>
            `;
        }

        // Load a joke on page load
        window.addEventListener('load', () => {
            generateJoke();
        });
    </script>
</body>
</html>
